<!doctype html>
<!--
  Source of public/og-default.png, the site's default link-preview image
  (1200x630). Colours are the tokens from src/styles/tokens.css,
  repeated here because this page is rendered on its own. After a change,
  re-render from the repo root:

  chromium --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1200,630 --screenshot=public/og-default.png scripts/og-image/og-default.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Default link-preview image</title>
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        font-weight: 400;
        src: url("../../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Schibsted Grotesk";
        font-weight: 800;
        src: url("../../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        src: url("../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        box-sizing: border-box;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 72px 88px 64px;
        background: #0b1117; /* --ground */
        color: #e8edf1; /* --ink */
        font-family: "Schibsted Grotesk", sans-serif;
        border-left: 12px solid #f08a5d; /* --accent */
      }

      .label,
      .tags {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: #f08a5d; /* --accent */
        margin: 0;
      }

      .main {
        align-self: center;
      }

      h1 {
        font-size: 80px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0 0 20px;
      }

      .headline {
        font-size: 40px;
        margin: 0 0 18px;
      }

      .tagline {
        font-size: 30px;
        color: #93a1ad; /* --muted */
        margin: 0;
      }

      .tags {
        padding-top: 28px;
        border-top: 2px solid #22303b; /* --line */
        color: #93a1ad;
      }
    </style>
  </head>
  <body>
    <p class="label">arsanurak.github.io</p>
    <div class="main">
      <h1>Anurak Chatree (Ars)</h1>
      <p class="headline">Senior Platform &amp; DevOps Engineer</p>
      <p class="tagline">Kubernetes, GitOps and AWS, debugged from the network layer up.</p>
    </div>
    <p class="tags">Case studies · Kubernetes · GitOps · AWS · Networking</p>
  </body>
</html>
