name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # deploy.yml runs these same steps before it publishes. Keep the two in
  # step: change one, change both.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Node version pinned in mise.toml
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - run: npm ci

      # Everything in `npm run check` except the publish guard: typecheck, unit
      # tests, production build and the checks on dist/
      - run: npm run check:without-guard

      # Scans dist/ for denylisted strings. The list lives only in an Actions
      # secret, exposed to this step alone, never to the build. This step only
      # states whether the run gets Actions secrets (pull requests from forks
      # and Dependabot don't); the script decides what a missing list means.
      - run: npm run check:publish-guard
        env:
          PUBLISH_GUARD_DENYLIST: ${{ secrets.PUBLISH_GUARD_DENYLIST }}
          PUBLISH_GUARD_SECRETS_AVAILABLE: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')) }}

      # Lighthouse performance and accessibility budget on every built page,
      # using the runner's preinstalled Chrome. Thresholds: lighthouserc.json
      - run: npm run lighthouse
