name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Node version pinned in mise.toml
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - run: npm ci

      # Typecheck, unit tests, production build and the checks on dist/
      - run: npm run check:site

      # Scans dist/ for denylisted strings. The list lives only in an Actions
      # secret, exposed to this step alone, never to the build. Fails closed
      # when the secret is missing, except on pull requests that get no
      # Actions secrets (forks and Dependabot), where it warns.
      - run: npm run check:publish-guard
        env:
          PUBLISH_GUARD_DENYLIST: ${{ secrets.PUBLISH_GUARD_DENYLIST }}
          PUBLISH_GUARD_NO_SECRETS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') }}
