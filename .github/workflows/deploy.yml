name: Deploy

# Builds the site and publishes it to GitHub Pages (source: GitHub Actions).
# Runs only for main: on every push to it, or by hand from the Actions tab
# with main selected. Manual runs from any other branch are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs dependencies with npm ci, runs `npm run build` and uploads
      # dist/ as the Pages artifact. Node 24, matching mise.toml.
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          node-version: "24"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write to Pages or mint the OIDC token it needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
