name: Deploy

# Checks and builds the site, then publishes it to GitHub Pages (source:
# GitHub Actions).
# Runs only for main: on every push to it, or by hand from the Actions tab
# with main selected. Manual runs from any other branch are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same gate as checks.yml, step for step, so nothing reaches Pages
      # that Checks would fail. Keep the two in step: change one, change both.

      # Installs the Node version pinned in mise.toml
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # Installs exactly what package-lock.json lists
      - run: npm ci

      # Everything in `npm run check` except the publish guard: typecheck, unit
      # tests, production build and the checks on dist/. The dist/ it builds is
      # the one uploaded below.
      - run: npm run check:without-guard

      # Scans dist/ for denylisted strings. The list lives only in an Actions
      # secret, exposed to this step alone, never to the build. Deploys run only
      # for main, so the secret is always available here and a missing list fails.
      - run: npm run check:publish-guard
        env:
          PUBLISH_GUARD_DENYLIST: ${{ secrets.PUBLISH_GUARD_DENYLIST }}
          PUBLISH_GUARD_SECRETS_AVAILABLE: "true"

      # Lighthouse performance and accessibility budget on every built page.
      # Thresholds: lighthouserc.json
      - run: npm run lighthouse

      # Uploads the checked dist/ as the Pages artifact for the deploy job.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write to Pages or mint the OIDC token it needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
