# Weekly version updates for npm packages and GitHub Actions. Actions are
# pinned to full commit SHAs with the version in a comment; Dependabot updates
# both the SHA and the comment. Each update PR runs the full checks.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a new release settle for a few days before proposing it.
    cooldown:
      default-days: 7
    groups:
      # Minor and patch bumps in one PR; majors get their own.
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
